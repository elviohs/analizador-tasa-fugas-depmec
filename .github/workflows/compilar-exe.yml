name: Compilar ejecutable Windows

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        run: python -m pytest -q tests

      - name: Compilar con PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name DET_FUGAS_IAC_V3 --icon icono.ico --add-data "logo_depmec.png;." --add-data "icono.png;." analizador_fugas_v3.py

      - name: Probar el ejecutable (--autotest)
        shell: pwsh
        run: |
          $salida = Join-Path $PWD 'autotest.txt'
          $p = Start-Process -FilePath 'dist\DET_FUGAS_IAC_V3.exe' -ArgumentList '--autotest', "`"$salida`"" -Wait -PassThru
          Get-Content $salida
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Select-String -Path $salida -Pattern '^OK' -Quiet)) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: DET_FUGAS_IAC_V3
          path: dist/DET_FUGAS_IAC_V3.exe

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "dist/DET_FUGAS_IAC_V3.exe" --clobber
          } else {
            $notas = "Ejecutable de Windows del Analizador de tasa de fugas DEPMEC $tag.`n`nDescargue DET_FUGAS_IAC_V3.exe y ejecútelo (no requiere Python). Cambios: ver CHANGELOG.md.`n`nSoftware en pruebas: revise los resultados críticos."
            gh release create $tag "dist/DET_FUGAS_IAC_V3.exe" --title "Analizador de fugas DEPMEC $tag" --notes $notas
          }
